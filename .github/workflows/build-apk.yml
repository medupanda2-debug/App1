name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Faylları topla (zip də, ayrı-ayrı fayllar da olar)
        run: |
          # kökdə index.html yoxdursa və zip varsa, zipi aç
          if [ ! -f index.html ]; then
            for z in ./*.zip; do [ -f "$z" ] && unzip -qo "$z" -d unz; done || true
          fi
          mkdir -p www/icons native
          f() { find . -path ./.git -prune -o -path ./www -prune -o -path ./node_modules -prune -o -path ./android -prune -o -type f -name "$1" -print | head -n1; }
          cp "$(f index.html)" www/index.html
          cp "$(f manifest.webmanifest)" www/manifest.webmanifest
          cp "$(f sw.js)" www/sw.js
          for n in icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png; do cp "$(f $n)" www/icons/$n; done
          for j in MainActivity AlarmReceiver AlarmService AlarmPlugin AlarmScheduler BootReceiver; do cp "$(f $j.java)" native/$j.java; done
          ls www www/icons native

      - name: Capacitor + Android layihəsi
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Yuxu Taymeri" az.yuxu.taymeri --web-dir www
          npx cap add android
          npx cap sync android

      - name: Native alarm, icazələr, ikon
        run: |
          pip install pillow
          cp native/*.java android/app/src/main/java/az/yuxu/taymeri/
          python3 - <<'PY'
          import os, shutil, wave, struct, math
          from PIL import Image, ImageDraw
          res = 'android/app/src/main/res'

          # --- ikonlar ---
          full = Image.open('www/icons/icon-512.png').convert('RGBA')
          fg = Image.open('www/icons/icon-maskable-512.png').convert('RGBA')
          for d, legacy, adaptive in [('mdpi',48,108),('hdpi',72,162),('xhdpi',96,216),('xxhdpi',144,324),('xxxhdpi',192,432)]:
              p = f'{res}/mipmap-{d}'
              os.makedirs(p, exist_ok=True)
              full.resize((legacy, legacy), Image.LANCZOS).save(f'{p}/ic_launcher.png')
              r = full.resize((legacy, legacy), Image.LANCZOS)
              m = Image.new('L', (legacy, legacy), 0)
              ImageDraw.Draw(m).ellipse([0, 0, legacy-1, legacy-1], fill=255)
              o = Image.new('RGBA', (legacy, legacy), (0,0,0,0)); o.paste(r, (0,0), m)
              o.save(f'{p}/ic_launcher_round.png')
              fg.resize((adaptive, adaptive), Image.LANCZOS).save(f'{p}/ic_launcher_foreground.png')
          open(f'{res}/values/ic_launcher_background.xml', 'w').write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#0C1020</color></resources>\n')

          PY
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <application#' $M
          sed -i 's#</application>#    <service android:name=".AlarmService" android:exported="false" android:foregroundServiceType="mediaPlayback"/>\n    <receiver android:name=".AlarmReceiver" android:exported="false"/>\n    <receiver android:name=".BootReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter></receiver>\n    </application>#' $M
          cat $M

      - name: APK yığ
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Yuxu-Taymeri.apk

      - name: Release yarat (APK birbaşa yüklənir)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Yuxu Taymeri v${{ github.run_number }}
          files: Yuxu-Taymeri.apk
          
